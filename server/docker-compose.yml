version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: transport
      MYSQL_USER: trike_user
      MYSQL_PASSWORD: trike_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:

    # Usage:
    # docker compose up -d
    # Then run migrations from your host or a web container that has Django installed.
